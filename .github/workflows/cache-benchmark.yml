name: cache-benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    uses: ./.github/workflows/benchmark-project.yml
    with:
      project: cargo-cache-testing
      repository: ${{ github.repository }}
      ref: ${{ github.sha }}
      smoke-command: ./target/release/cargo-cache-testing --url https://example.com
    secrets: inherit
