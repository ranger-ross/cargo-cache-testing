name: cache-benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  no-cache:
    name: no-cache (baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fetch --locked
      - name: Build release (timed)
        run: |
          start=$SECONDS
          cargo build --release --locked --timings
          echo "BUILD_SECS=$((SECONDS - start))" >> "$GITHUB_ENV"
      - name: Report build time
        if: always()
        run: echo "no-cache build took ${BUILD_SECS:-unknown}s"
      - name: Upload Cargo timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-no-cache
          path: target/cargo-timings
      - run: ./target/release/cargo-cache-testing --url https://example.com

  rust-cache:
    name: rust-cache (Swatinem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - name: Build release (timed)
        run: |
          start=$SECONDS
          cargo build --release --locked --timings
          echo "BUILD_SECS=$((SECONDS - start))" >> "$GITHUB_ENV"
      - name: Report build time
        if: always()
        run: echo "rust-cache build took ${BUILD_SECS:-unknown}s"
      - name: Upload Cargo timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-rust-cache
          path: target/cargo-timings
      - run: ./target/release/cargo-cache-testing --url https://example.com

  sccache:
    name: sccache
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: cargo fetch --locked
      - name: Build release (timed)
        env:
          RUSTC_WRAPPER: sccache
        run: |
          start=$SECONDS
          cargo build --release --locked --timings
          echo "BUILD_SECS=$((SECONDS - start))" >> "$GITHUB_ENV"
      - name: Report build time
        if: always()
        run: echo "sccache build took ${BUILD_SECS:-unknown}s"
      - name: Upload Cargo timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-sccache
          path: target/cargo-timings
      - run: ./target/release/cargo-cache-testing --url https://example.com

  kache:
    name: kache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: kunobi-ninja/kache-action@v1
        with:
          pr-comment: "false"
      - run: cargo fetch --locked
      - name: Build release (timed)
        run: |
          start=$SECONDS
          cargo build --release --locked --timings
          echo "BUILD_SECS=$((SECONDS - start))" >> "$GITHUB_ENV"
      - name: Report build time
        if: always()
        run: echo "kache build took ${BUILD_SECS:-unknown}s"
      - name: Upload Cargo timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-kache
          path: target/cargo-timings
      - run: ./target/release/cargo-cache-testing --url https://example.com

  boxington:
    name: mr-boxington
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: jdx/mr-boxington-action@v1
      - run: cargo fetch --locked
      - name: Build release (timed)
        run: |
          start=$SECONDS
          mbx build --release --locked --timings
          echo "BUILD_SECS=$((SECONDS - start))" >> "$GITHUB_ENV"
      - name: Report build time
        if: always()
        run: echo "boxington build took ${BUILD_SECS:-unknown}s"
      - name: Upload Cargo timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-boxington
          path: target/cargo-timings
      - run: ./target/release/cargo-cache-testing --url https://example.com

  native-rust-cache:
    name: native (actions/cache)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
      - name: Restore native build cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/shared-storage
          key: native-rust-cache-v3-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'tools/cargo/cargo') }}
          restore-keys: |
            native-rust-cache-v3-${{ runner.os }}-
      - name: Fetch dependencies (timed)
        env:
          RUSTUP_AUTO_INSTALL: "0"
          RUSTUP_TOOLCHAIN: stable-x86_64-unknown-linux-gnu
        run: |
          chmod +x tools/cargo/cargo
          tools/cargo/cargo --version
          start=$SECONDS
          tools/cargo/cargo fetch --locked
          echo "FETCH_SECS=$((SECONDS - start))" >> "$GITHUB_ENV"
      - name: Build with native cache (timed)
        env:
          RUSTUP_AUTO_INSTALL: "0"
          RUSTUP_TOOLCHAIN: stable-x86_64-unknown-linux-gnu
        run: |
          start=$SECONDS
          tools/cargo/cargo build --release --locked --timings -Zshared-blob-storage
          echo "BUILD_SECS=$((SECONDS - start))" >> "$GITHUB_ENV"
      - name: Report build time
        if: always()
        run: |
          echo "native (rust-cache) fetch took ${FETCH_SECS:-unknown}s"
          echo "native (rust-cache) build took ${BUILD_SECS:-unknown}s"
      - name: Upload Cargo timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-native-rust-cache
          path: target/cargo-timings
      - name: Build cache stats
        if: always()
        run: |
          du -sh ~/.cargo/shared-storage 2>/dev/null || echo "no shared-storage dir"
          find ~/.cargo/shared-storage -type f 2>/dev/null | wc -l
      - run: ./target/release/cargo-cache-testing --url https://example.com

  native-build-buddy:
    name: native (build buddy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
      - name: Fetch dependencies (timed)
        env:
          RUSTUP_AUTO_INSTALL: "0"
          RUSTUP_TOOLCHAIN: stable-x86_64-unknown-linux-gnu
        run: |
          chmod +x tools/cargo/cargo
          tools/cargo/cargo --version
          start=$SECONDS
          tools/cargo/cargo fetch --locked
          echo "FETCH_SECS=$((SECONDS - start))" >> "$GITHUB_ENV"
      - name: Build with BuildBuddy REAPI cache (timed)
        env:
          RUSTUP_AUTO_INSTALL: "0"
          RUSTUP_TOOLCHAIN: stable-x86_64-unknown-linux-gnu
          BUILD_BUDDY_API_KEY: ${{ secrets.BUILD_BUDDY_API_KEY }}
        run: |
          test -n "$BUILD_BUDDY_API_KEY"
          start=$SECONDS
          # Keep local artifacts on this runner only so later runs exercise REAPI.
          tools/cargo/cargo build --release --locked --timings \
            -Zshared-blob-storage \
            --config 'cache.remote.url="grpcs://remote.buildbuddy.io"' \
            --config 'cache.remote.instance-name="cargo-cache-testing"' \
            --config 'cache.remote.api-key-env="BUILD_BUDDY_API_KEY"'
          echo "BUILD_SECS=$((SECONDS - start))" >> "$GITHUB_ENV"
      - name: Report build time
        if: always()
        run: |
          echo "native (build buddy) fetch took ${FETCH_SECS:-unknown}s"
          echo "native (build buddy) build took ${BUILD_SECS:-unknown}s"
      - name: Upload Cargo timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-native-build-buddy
          path: target/cargo-timings
      - name: Build cache stats
        if: always()
        run: |
          du -sh ~/.cargo/shared-storage 2>/dev/null || echo "no shared-storage dir"
          find ~/.cargo/shared-storage -type f 2>/dev/null | wc -l
      - run: ./target/release/cargo-cache-testing --url https://example.com
