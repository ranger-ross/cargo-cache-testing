name: cache-benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  no-cache:
    name: no-cache (baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release (timed)
        run: |
          start=$SECONDS
          cargo build --release
          echo "BUILD_SECS=$((SECONDS - start))" >> "$GITHUB_ENV"
      - name: Report build time
        if: always()
        run: echo "no-cache build took ${BUILD_SECS:-unknown}s"
      - run: ./target/release/cargo-cache-testing --url https://example.com

  rust-cache:
    name: rust-cache (Swatinem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release (timed)
        run: |
          start=$SECONDS
          cargo build --release
          echo "BUILD_SECS=$((SECONDS - start))" >> "$GITHUB_ENV"
      - name: Report build time
        if: always()
        run: echo "rust-cache build took ${BUILD_SECS:-unknown}s"
      - run: ./target/release/cargo-cache-testing --url https://example.com

  sccache:
    name: sccache
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Build release (timed)
        env:
          RUSTC_WRAPPER: sccache
        run: |
          start=$SECONDS
          cargo build --release
          echo "BUILD_SECS=$((SECONDS - start))" >> "$GITHUB_ENV"
      - name: Report build time
        if: always()
        run: echo "sccache build took ${BUILD_SECS:-unknown}s"
      - run: ./target/release/cargo-cache-testing --url https://example.com

  kache:
    name: kache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: kunobi-ninja/kache-action@v1
        with:
          pr-comment: "false"
      - name: Build release (timed)
        run: |
          start=$SECONDS
          cargo build --release
          echo "BUILD_SECS=$((SECONDS - start))" >> "$GITHUB_ENV"
      - name: Report build time
        if: always()
        run: echo "kache build took ${BUILD_SECS:-unknown}s"
      - run: ./target/release/cargo-cache-testing --url https://example.com

  boxington:
    name: mr-boxington
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: jdx/mr-boxington-action@v1
      - name: Build release (timed)
        run: |
          start=$SECONDS
          mbx build --release
          echo "BUILD_SECS=$((SECONDS - start))" >> "$GITHUB_ENV"
      - name: Report build time
        if: always()
        run: echo "boxington build took ${BUILD_SECS:-unknown}s"
      - run: ./target/release/cargo-cache-testing --url https://example.com

  cargo-build-cache:
    name: cargo-build-cache (new feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
      - name: Restore cargo build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/build-cache
          key: cargo-build-cache-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-build-cache-v2-${{ runner.os }}-
      - name: Build with feature cargo (timed)
        env:
          RUSTUP_AUTO_INSTALL: "0"
          RUSTUP_TOOLCHAIN: stable-x86_64-unknown-linux-gnu
        run: |
          chmod +x tools/cargo/cargo
          tools/cargo/cargo --version
          start=$SECONDS
          tools/cargo/cargo build --release
          echo "BUILD_SECS=$((SECONDS - start))" >> "$GITHUB_ENV"
      - name: Report build time
        if: always()
        run: echo "cargo-build-cache build took ${BUILD_SECS:-unknown}s"
      - name: Build cache stats
        if: always()
        run: |
          du -sh ~/.cargo/build-cache 2>/dev/null || echo "no build-cache dir"
          find ~/.cargo/build-cache -type f 2>/dev/null | wc -l
      - run: ./target/release/cargo-cache-testing --url https://example.com
